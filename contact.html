<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
<Header>
    <div id="navbar-container"></div>
</Header>

<section class="contact-section">
    <div class="contact-info py-2 container">
        <h1 class="pt-4 mb-3">Contáctanos</h1>
        <p>¡Estamos encantados de hablar contigo!</p>
        <p>Si tienes cualquier otra consulta, por favor envía un correo a <span
                class="fw-semibold">contacto@ejemplo.com</span></p>
        <p>Nuestro amable equipo de Atención al Cliente estará encantado de ayudarte.</p>
    </div>

    <div class="separator w-90 mx-auto my-3" style="height: 4px; width: 80%; background-color: #dabadd"></div>

    <div class="contact-form container">
        <h2 class="mb-4 pt-4">¿Cómo podemos ayudarte?</h2>
        <form>
            <div class="mb-3 px-4">
                <div class="inputs-container-name-email d-flex flex-column">
                    <div class="input-name-container">
                        <label for="name" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="input-email-container">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                </div>

                <label for="message" class="form-label">Mensaje</label>
                <textarea class="form-control" id="message" rows="3" required></textarea>
                <button type="submit" class="btn my-3">Enviar</button>
            </div>
        </form>
    </div>
</section>
<div class="separator w-90 mx-auto my-3" style="height: 4px; width: 80%; background-color: #dabadd"></div>
<footer>
    <div id="footer-container"></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script type="module" src="./src/contacs.js"></script>
</body>
</html>
